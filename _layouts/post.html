---
layout: default
---

{% include meta-header.html %}

<div class="post">
  <h1 class="post-title">{{ page.title }}</h1>

  <article class="post-content">
    {{ content }}
  </article>

  {% if page.tags.size > 0 %}
  <nav class="post-tag" aria-label="Post tags">
    <ul>
      {% for tag in page.tags %}
      <li>
        <a href="{{ '/tags/' | relative_url }}#{{ tag | escape }}">
          <span>{{ tag }}</span>
        </a>
      </li>
      {% endfor %}
    </ul>
  </nav>
  {% endif %}

  <div class="post-subscribe">
    <iframe title="Subscribe to ksaitor" src="https://ksaitor.substack.com/embed" width="100%" height="320"
      frameborder="0" scrolling="no"></iframe>
  </div>

  <!-- Disqus -->
  {% if page.comments != false and site.disqus.id %}
  <div class="post-disqus">
    <section id="disqus_thread"></section>
    {% include disqus.html %}
  </div>
  {% endif %}

</div>
