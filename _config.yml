# # # # # # # # # # # # #
#   K i k o - p l u s   #
# # # # # # # # # # # # #

# Basic
name: 'ksaitor'
description: 'Essays on tech, startups, music, Singapore and other curious observations in life'
author:
  name: Raman Shalupau
  twitter: ksaitor
  github: ksaitor
  linkedin: ramanshalupau
  soundcloud: ksaitor
  instagram: ksaitor
  youtube: https://www.youtube.com/channel/UCPr3svxWJzJuog9R_-tKOUw

copyright:
  name: ksaitor

# Set this to a real GA4 measurement ID to enable analytics.
google-analytics:
  id:

disqus:
  id: ksaitor

# SEO
title: 'ksaitor — essays on tech, startups & life'
twitter:
  card: 'summary_large_image'
  username: 'ksaitor'

# URL
url: 'https://ksaitor.com' # the base hostname & protocol for your site
# url:                "http://localhost:4000" # use this url when you develop
baseurl: '' # the subpath of your site, e.g. /blog

# http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone: Asia/Singapore
permalink: /:year-:month-:day/:title/

# Pagination
paginate: 5
paginate_path: /page:num/

# Markdown
markdown: kramdown
kramdown:
  input: GFM

# Navigation
nav:
  - name: 'Archive'
    url: '/archive'
  - name: 'Twitter'
    url: 'https://x.com/ksaitor'

# Sass
sass:
  sass_dir: _sass
  style: :compressed

# Scopes
defaults:
  - scope:
      path: ''
      type: 'pages'
    values:
      layout: 'page'
      image: /assets/images/fb-og.jpg
  - scope:
      path: ''
      type: 'posts'
    values:
      layout: 'post'
      image: /assets/images/fb-og.jpg

# jekyll-seo-tag, see: http://www.rubydoc.info/gems/jekyll-seo-tag/1.2.0
plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

exclude: [vendor, Gemfile, Gemfile.lock, README.md, vercel.json, AGENTS.md]

